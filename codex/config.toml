# Installed as /etc/codex/config.toml, the system layer below
# ~/.codex/config.toml. Codex writes project trust and its own state to the
# user file, which stays out of the repository.

# Same no-prompt posture as claude/settings.json (bypassPermissions)
approval_policy = "never"
sandbox_mode = "danger-full-access"
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[tui]
theme = "dracula"
alternate_screen = "never"
screen_reader_detection_done = true

[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@latest",
  "--extension",
  "--executable-path",
  "/etc/profiles/per-user/sascha/bin/google-chrome-stable",
]
