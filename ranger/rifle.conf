# vim: ft=cfg
name ^[mM]akefile$ = make
ext 1              = man "$1"

ext pdf,         has xdg-open,  flag f = xdg-open "$@"
mime ^image,     has xdg-open,  flag f = xdg-open "$@"

ext gz,     has tar, flag f = tar xfvz "$@"
ext tar,    has tar, flag f = tar xfv "$@"

ext md,                has $EDITOR         = $EDITOR "$@"
ext json,              has jq              = jq . "$@" | $PAGER
ext yaml|yml,          has $EDITOR         = $EDITOR "$@"
ext xz,     has tar,              flag f = tar xfvJ "$@"
ext bz2,    has tar,              flag f = tar xfvj "$@"
ext zst,    has tar,              flag f = tar xfv --zstd "$@"

ext .* = $EDITOR "$@"
