# vim: ft=cfg
name ^[mM]akefile$ = make
ext 1              = man "$1"

ext pdf,         has xdg-open,  flag f = xdg-open "$@"
mime ^image,     has xdg-open,  flag f = xdg-open "$@"

ext gz,     has tar, flag f = tar xfvz "$@"
ext tar,    has tar, flag f = tar xfv "$@"

ext md,                has $EDITOR         = $EDITOR "$@"
ext json,              has jq              = jq . "$@" | $PAGER
ext yaml|yml,          has $EDITOR         = $EDITOR "$@"
ext xz,     has tar,              flag f = tar xfvJ "$@"
ext bz2,    has tar,              flag f = tar xfvj "$@"
ext zst,    has tar,              flag f = tar xfv --zstd "$@"
ext zst,    has zstd,             flag f = zstd -d "$@"

mime ^video,           has mpv,       flag f = mpv -- "$@"
mime ^video,           has xdg-open,  flag f = xdg-open "$@"
mime ^audio,           has mpv,       flag f = mpv -- "$@"
mime ^audio,           has xdg-open,  flag f = xdg-open "$@"

mime ^text,             has $EDITOR         = $EDITOR "$@"
mime ^application/json, has $EDITOR         = $EDITOR "$@"
mime ^application/xml,  has $EDITOR         = $EDITOR "$@"
label open, has xdg-open, flag f = xdg-open "$@"
