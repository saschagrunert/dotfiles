# Machine-specific sway configuration for the "nixos" desktop.
# Linked to ~/.config/sway/config.local by home-manager, see home.nix.

# Outputs (dual 4K). HDMI-A-2 starts at 2560, the logical width of HDMI-A-1
# at scale 1.5.
output HDMI-A-1 resolution 3840x2160@60Hz position 0,0 scale 1.5
output HDMI-A-2 resolution 3840x2160@60Hz position 2560,0 scale 1.5

# Workspace to output mapping
workspace $ws_browser output HDMI-A-1
workspace $ws_terminal output HDMI-A-2

# Mouse, configured through ratbagd
set $mouse "hollering-marmot"
exec ratbagctl $mouse resolution 0 dpi set 800
exec ratbagctl $mouse resolution active set 0
exec ratbagctl $mouse led 0 set mode cycle duration 8000 brightness 255
exec ratbagctl $mouse led 1 set mode cycle duration 8000 brightness 255
