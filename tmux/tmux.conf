bind r source-file ~/.tmux.conf \; display "Reloaded!"

unbind C-b
set -g prefix C-Space

bind v split-window -h -c '#{pane_current_path}'
bind C-v split-window -h -c '#{pane_current_path}'

bind h split-window -v -c '#{pane_current_path}'
bind C-h split-window -v -c '#{pane_current_path}'

bind-key q kill-window
bind-key C-q kill-window

bind-key c command-prompt -p "Project:" "new-window -n '%%'"
bind-key C-c command-prompt -p "Project:" "new-window -n '%%'"

set -g status-interval 5

set -g default-terminal "tmux-256color"
set -as terminal-features 'alacritty:256:RGB:usstyle'

set -s copy-command "wl-copy"

set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on
set -g renumber-windows on
set -g mouse on

is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

# Easier zoom
unbind-key C-z
bind-key -T prefix C-z resize-pane -Z

bind C-l send-keys 'C-l'

bind space copy-mode

bind-key C-space send-prefix

# clear history
bind k clear-history

# easy yank/copy
bind p run "tmux set-buffer \"$(wl-paste)\"; tmux paste-buffer"
bind C-p run "tmux set-buffer \"$(wl-paste)\"; tmux paste-buffer"
bind-key -T root MouseDown2Pane run "tmux set-buffer \"$(wl-paste --primary)\"; tmux paste-buffer"
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi Y send -X copy-pipe-end-of-line-and-cancel "wl-copy"

bind + delete-buffer

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Speed up commands
set-option -sg escape-time 0

set-option -gw window-status-format "#I:#10W#F"

# Instead of detaching, switch to next active session
set-option -g detach-on-destroy off

# start pane with 1
set -g base-index 1
set -g pane-base-index 1

set -g history-limit 20000

set-hook -g after-new-session 'run-shell "nvim --headless +\"sleep 1\" +q"'

set -g status-left-length 200
set -g status-right-length 200
set -g status-right "#(~/.tmux/scripts/rainbarf)"

set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g window-status-current-style "bg=#bd93f9,fg=#282a36"
set -g window-status-style "bg=#282a36,fg=#f8f8f2"
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g mode-style "bg=#44475a,fg=#f8f8f2"
