bind r source-file ~/.tmux.conf \; display "Reloaded!"

unbind C-b
set -g prefix C-Space

bind v split-window -h -c '#{pane_current_path}'
bind C-v split-window -h -c '#{pane_current_path}'

bind h split-window -v -c '#{pane_current_path}'
bind C-h split-window -v -c '#{pane_current_path}'

bind-key q kill-window
bind-key C-q kill-window

bind-key c command-prompt -p "Project:" "if-shell -F '%%' 'new-window -n \"%%\"' 'new-window'"
bind-key C-c command-prompt -p "Project:" "if-shell -F '%%' 'new-window -n \"%%\"' 'new-window'"

set -g status-interval 5

set -g default-terminal "tmux-256color"
set -as terminal-features 'alacritty:256:RGB:usstyle'

set -s copy-command "wl-copy"

set -g focus-events on
set -g extended-keys on
set -g allow-passthrough on
set -g renumber-windows on
set -g mouse on
set -ga update-environment " WAYLAND_DISPLAY"

bind -n C-h if-shell -F '#{m/ri:(^|/)g?(view|n?vim?)(diff)?$,#{pane_current_command}}' "send-keys C-h" "select-pane -L"
bind -n C-j if-shell -F '#{m/ri:(^|/)g?(view|n?vim?)(diff)?$,#{pane_current_command}}' "send-keys C-j" "select-pane -D"
bind -n C-k if-shell -F '#{m/ri:(^|/)g?(view|n?vim?)(diff)?$,#{pane_current_command}}' "send-keys C-k" "select-pane -U"
bind -n C-l if-shell -F '#{m/ri:(^|/)g?(view|n?vim?)(diff)?$,#{pane_current_command}}' "send-keys C-l" "select-pane -R"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

# Easier zoom
unbind-key C-z
bind-key -T prefix C-z resize-pane -Z

bind C-l send-keys 'C-l'

bind space copy-mode
bind s display-popup -E -w 60% -h 60% "\
  tmux list-sessions -F '#{session_name}: #{session_windows} windows#{?session_attached, (attached),}' |\
  fzf --reverse --header='Switch session' \
    --color=fg:#f8f8f2,bg:#282a36,hl:#bd93f9 \
    --color=fg+:#f8f8f2,bg+:#44475a,hl+:#bd93f9 \
    --color=info:#ffb86c,prompt:#50fa7b,pointer:#ff79c6 \
    --color=marker:#ff79c6,spinner:#ffb86c,header:#6272a4 \
    --border |\
  cut -d: -f1 |\
  xargs tmux switch-client -t"
bind w display-popup -E -w 60% -h 60% "\
  tmux list-windows -F '#{window_index}: #{window_name} #{?window_active,(active),}' |\
  fzf --reverse --header='Switch window' \
    --color=fg:#f8f8f2,bg:#282a36,hl:#bd93f9 \
    --color=fg+:#f8f8f2,bg+:#44475a,hl+:#bd93f9 \
    --color=info:#ffb86c,prompt:#50fa7b,pointer:#ff79c6 \
    --color=marker:#ff79c6,spinner:#ffb86c,header:#6272a4 \
    --border |\
  cut -d: -f1 |\
  xargs tmux select-window -t"

bind-key C-space send-prefix

# clear history
bind k send-keys -R \; clear-history

# easy yank/copy
bind p run "tmux set-buffer \"$(wl-paste)\"; tmux paste-buffer"
bind C-p run "tmux set-buffer \"$(wl-paste)\"; tmux paste-buffer"
bind-key -T root MouseDown2Pane run "tmux set-buffer \"$(wl-paste --primary)\"; tmux paste-buffer"
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi Y send -X copy-pipe-end-of-line-and-cancel

bind + delete-buffer

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Speed up commands
set-option -sg escape-time 0

set-option -gw window-status-format "#[fg=#44475a,bg=#282a36]#[fg=#f8f8f2,bg=#44475a] #I:#{=10:window_name} #[fg=#44475a,bg=#282a36]"
set-option -gw window-status-current-format "#[fg=#bd93f9,bg=#282a36]#[fg=#282a36,bg=#bd93f9,bold] #I:#{=10:window_name} #[fg=#bd93f9,bg=#282a36]"
set-option -g window-status-separator " "

# Instead of detaching, switch to next active session
set-option -g detach-on-destroy off

# start pane with 1
set -g base-index 1
set -g pane-base-index 1

set -g history-limit 20000

set -g status-left "#[fg=#282a36,bg=#bd93f9] #{?client_prefix,[PREFIX] - ,}#S #[fg=#bd93f9,bg=#6272a4]#[fg=#f8f8f2,bg=#6272a4] #(~/.tmux/scripts/pwd) #[fg=#6272a4,bg=#44475a]#[fg=#f8f8f2,bg=#44475a] #(~/.tmux/scripts/git-status) #[fg=#44475a,bg=#282a36]"
set -g status-right "#[fg=#44475a,bg=#282a36]#[fg=#f8f8f2,bg=#44475a] #(~/.tmux/scripts/ip) #[fg=#6272a4,bg=#44475a]#[fg=#f8f8f2,bg=#6272a4] %a  %d. %b  %R #[fg=#bd93f9,bg=#6272a4]#[fg=#282a36,bg=#bd93f9]   #H "
set -g status-left-length 150
set -g status-right-length 100

set -g status-justify centre
set -g status-style "bg=#282a36,fg=#f8f8f2"

set -g pane-border-style "fg=#6272a4"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style "bg=#bd93f9,fg=#282a36,bold"
set -g display-time 2000
set -g set-clipboard on
set -g mode-style "bg=#44475a,fg=#f8f8f2"
